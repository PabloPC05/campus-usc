[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "campus-usc"
version = "0.1.0"
description = "El Campus Virtual de la USC en la terminal: rápido y con su aspecto"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PabloPC05" }]
keywords = ["usc", "moodle", "campus-virtual", "cli", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
# The engine: session, Moodle client, timetables and exam dates.
dependencies = ["mcp-usc>=0.11"]

[project.optional-dependencies]
# Assisted login (Microsoft + MFA) through the installed Chrome or Edge.
browser-auth = ["mcp-usc[browser-auth]"]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
campus = "campus_usc.app:main"

[tool.uv.sources]
# The disk caches and the faster timetable/exam lookups `campus` relies on live in the
# local mcp-usc checkout until they are published.
mcp-usc = { path = "../mcp-usc", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/campus_usc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
