[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "campus-usc"
version = "0.1.0"
description = "El Campus Virtual de la USC en la terminal: rápido y con su aspecto"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PabloPC05" }]
keywords = ["usc", "moodle", "campus-virtual", "cli", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
# The engine (campus-usc-core): the library that talks to Moodle. Lives in core/ of this
# same repo; comes as a zip so installing does not need git.
# The login window opens in your own Chrome/Edge/Brave: no browser to download.
dependencies = ["campus-usc-core @ https://github.com/PabloPC05/campus-usc/archive/refs/heads/main.zip#subdirectory=core"]

[project.optional-dependencies]
# A bundled login browser (Playwright, ~160 MB) for computers with no Chrome, Edge or
# Brave, such as a Mac with only Safari. `browser-auth` is its old name.
navegador = ["campus-usc-core[browser-auth] @ https://github.com/PabloPC05/campus-usc/archive/refs/heads/main.zip#subdirectory=core"]
browser-auth = ["campus-usc-core[browser-auth] @ https://github.com/PabloPC05/campus-usc/archive/refs/heads/main.zip#subdirectory=core"]
# Installable modules (campus modulos). This one lives in modulos/horarios of this repo.
horarios = [
  "campus-usc-horarios @ https://github.com/PabloPC05/campus-usc/archive/refs/heads/main.zip#subdirectory=modulos/horarios",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
campus = "campus_usc.app:main"
campus-usc = "campus_usc.app:main"

[project.urls]
Homepage = "https://github.com/PabloPC05/campus-usc"
Repository = "https://github.com/PabloPC05/campus-usc.git"
Issues = "https://github.com/PabloPC05/campus-usc/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/campus_usc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
