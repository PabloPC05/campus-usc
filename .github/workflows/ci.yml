name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with the horarios module from this checkout)
        run: |
          uv sync --extra dev
          uv pip install -e modulos/horarios

      - name: Lint
        run: uv run --no-sync ruff check src tests modulos instalar.py && uv run --no-sync ruff format --check src tests modulos instalar.py

      - name: Test the core
        run: uv run --no-sync pytest tests

      - name: Test the horarios module
        run: uv run --no-sync pytest modulos/horarios/tests

      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv build
