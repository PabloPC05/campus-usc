name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # The four local pieces, from this checkout (not the published zip): the motor
      # (campus-usc-core), the MCP server (mcp-usc), the CLI (campus-usc) and the horarios module.
      - name: Install the four packages (editable, local)
        run: |
          uv venv
          uv pip install -e "./core[dev]"
          uv pip install "mcp>=1.29,<2"
          uv pip install --no-deps -e ./mcp -e . -e ./modulos/horarios
          if [ -f .venv/bin/python ]; then PY="$(pwd)/.venv/bin/python"; else PY="$(pwd)/.venv/Scripts/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          "$PY" -m ruff check core/src mcp/src mcp/tests src tests modulos instalar.py ci
          "$PY" -m ruff format --check core/src mcp/src mcp/tests src tests modulos instalar.py ci

      - name: Test the motor and the MCP server
        run: |
          cd mcp && "$PY" -m pytest

      - name: Test the CLI
        run: |
          "$PY" -m pytest tests

      - name: Test the horarios module
        run: |
          "$PY" -m pytest modulos/horarios/tests

      - name: Build the packages
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          uv build core
          uv build mcp
          uv build .
